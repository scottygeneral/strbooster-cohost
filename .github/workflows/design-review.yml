name: AI agents website review (no deployment)
on:
  push:
    branches: [design/ai-growth-systems, update/ai-agents-scroll-footer]
    paths:
      - 'templates/**'
      - 'growth.css'
      - 'growth.js'
      - 'app.js'
      - 'vendor/scrollcraft/**'
      - 'scripts/**'
      - '.github/workflows/design-review.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: design-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-review:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and check the complete checkout
        run: |
          python3 scripts/render-site.py
          python3 scripts/check-story.py
          node --check app.js
          node --check growth.js
          node --check scripts/test-growth.cjs
          node --check scripts/verify-scroll.mjs
      - name: Install browser QA tools only
        timeout-minutes: 5
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install chromium
      - name: Review desktop, phone, motion and fallbacks
        timeout-minutes: 9
        run: |
          set -o pipefail
          mkdir -p previews/growth-review
          python3 -m http.server 8765 --bind 127.0.0.1 > previews/growth-review/server.log 2>&1 &
          review_server_pid=$!
          trap 'kill "$review_server_pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import time
          import urllib.request
          for attempt in range(40):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8765/', timeout=1) as response:
                      page = response.read().decode('utf-8')
              except OSError:
                  if attempt == 39:
                      raise
                  time.sleep(0.1)
              else:
                  if 'Custom AI Growth Systems' not in page or 'data-demo' not in page:
                      raise SystemExit('Local server is not serving the rebuilt STR Booster page.')
                  break
          PY
          # Complete the independent review passes even if one reports a finding.
          # Every external calendar/chat/analytics request is blocked by the harnesses.
          review_status=0
          node scripts/test-growth.cjs | tee previews/growth-review/functional.log || review_status=1
          node scripts/verify-scroll.mjs --url http://127.0.0.1:8765 --per-act 6 --width 1440 --height 900 --out previews/growth-review/scroll-desktop | tee previews/growth-review/scroll-desktop.log || review_status=1
          node scripts/verify-scroll.mjs --url http://127.0.0.1:8765 --per-act 6 --width 390 --height 844 --out previews/growth-review/scroll-mobile | tee previews/growth-review/scroll-mobile.log || review_status=1
          node scripts/verify-scroll.mjs --url http://127.0.0.1:8765 --per-act 6 --width 1440 --height 900 --reduced-motion --out previews/growth-review/scroll-reduced | tee previews/growth-review/scroll-reduced.log || review_status=1
          exit "$review_status"
      - name: Upload screenshots and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strbooster-ai-growth-review
          path: previews/growth-review/
          if-no-files-found: warn
          retention-days: 14
