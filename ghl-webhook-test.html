<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STR Booster — GHL Webhook Test</title>
<style>
body{font-family:Arial,sans-serif;background:#F5F3EE;color:#0D1F2D;display:grid;place-items:center;min-height:100vh;margin:0}.card{max-width:620px;background:#fff;padding:32px;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.08)}button{background:#1A7F64;color:#fff;border:0;border-radius:8px;padding:14px 20px;font-weight:700;cursor:pointer}pre{white-space:pre-wrap;background:#f3f4f4;padding:16px;border-radius:8px;font-size:12px}.ok{color:#1A7F64}.err{color:#b42318}
</style>
</head>
<body>
<div class="card">
<h1>GHL Webhook Test</h1>
<p>This temporary page sends the same field structure used by the 30-Day Revenue Growth Sprint application.</p>
<button id="send">Send Test Payload</button>
<p id="status">Ready.</p>
<pre id="payload"></pre>
</div>
<script>
const WEBHOOK='https://services.leadconnectorhq.com/hooks/VYmmcd3zhhauMLyqAUSb/webhook-trigger/423905a5-935c-4f96-942c-d4202e55b3f5';
const payload={
  name:'STR Booster Webhook Test',
  email:'webhook-test@strbooster.com',
  listing_url:'https://www.airbnb.com/rooms/123456789',
  annual_revenue:'100k-200k',
  property_count:'2-3',
  biggest_challenge:'Testing GHL field mapping for the 30-Day Revenue Growth Sprint',
  source:'STR Booster Revenue Growth Sprint',
  offer:'30-Day Revenue Growth Sprint',
  offer_price_usd:2750,
  booking_url:'https://links.strbooster.com/widget/booking/OnBzpe1qEasSowPwkxXU'
};
document.getElementById('payload').textContent=JSON.stringify(payload,null,2);
async function sendTest(){
 const status=document.getElementById('status');
 status.className='';
 status.textContent='Sending…';
 try{
   const r=await fetch(WEBHOOK,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
   if(!r.ok) throw new Error('HTTP '+r.status);
   status.className='ok';
   status.textContent='Test sent successfully. Return to GHL and fetch the sample request.';
 }catch(e){
   status.className='err';
   status.textContent='Test failed: '+e.message;
 }
}
document.getElementById('send').addEventListener('click',sendTest);
</script>
</body>
</html>
