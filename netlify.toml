# Static output. Rebuild before deployment so inner-page navigation stays in sync.
# Only the public site files are copied into _site/ (see scripts/build-public.py),
# so the README, scripts, templates, briefs, uploads and screenshots stay private.
[build]
  publish = "_site"
  command = "python3 scripts/render-site.py && python3 scripts/check-story.py && python3 scripts/build-public.py"
  functions = "netlify/functions"

# Images, video and fonts rarely change, so browsers keep them for a week
# instead of re-checking on every visit (PageSpeed flags the default of 0).
# A replaced file under the same name can take up to a week to show for
# returning visitors; give a changed asset a new file name to avoid that.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# One host for search engines: canonical tags, the sitemap and llms.txt all use
# the apex domain, so www requests move there permanently.
[[redirects]]
  from = "https://www.strbooster.com/*"
  to = "https://strbooster.com/:splat"
  status = 301
  force = true

[[redirects]]
