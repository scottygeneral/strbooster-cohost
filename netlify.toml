# Static output. Rebuild before deployment so inner-page navigation stays in sync.
[build]
  publish = "."
  command = "python3 scripts/render-site.py && python3 scripts/check-story.py"

[[redirects]]
  from = "/community.html"
  to = "https://my.hostgrowthhub.com/communities/groups/host-growth-hub/home?invite=6aa7a9206e3c5d8ede86e13d"
  status = 302
  force = true

[[redirects]]
  from = "/community"
  to = "https://my.hostgrowthhub.com/communities/groups/host-growth-hub/home?invite=6aa7a9206e3c5d8ede86e13d"
  status = 302
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# Preserve the existing decision not to publish branch/PR previews.
[context.deploy-preview]
  ignore = "exit 0"
[context.branch-deploy]
  ignore = "exit 0"

[[redirects]]
  from = "/STR Booster Website.dc.html"
  to = "/"
  status = 301
  force = true

