# Netlify config for STR Booster Cohost — static site, no build step.
[build]
  publish = "."
  command = ""

# Preserve direct community signup redirects.
[[redirects]]
  from = "/community.html"
  to = "https://my.hostgrowthhub.com/communities/groups/host-growth-hub/home?invite=6aa7a9206e3c5d8ede86e13d"
  status = 302
  force = true

[[redirects]]
  from = "/community"
  to = "https://my.hostgrowthhub.com/communities/groups/host-growth-hub/home?invite=6aa7a9206e3c5d8ede86e13d"
  status = 302
  force = true

# Consolidate the homepage alias; missing files use Netlify's native 404.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# Review this redesign privately in Sites. Do not publish branch/PR previews.
[context.deploy-preview]
  ignore = "exit 0"
[context.branch-deploy]
  ignore = "exit 0"

# Retire the archived version of the previous homepage.
[[redirects]]
  from = "/STR Booster Website.dc.html"
  to = "/"
  status = 301
  force = true
