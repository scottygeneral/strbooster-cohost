# Netlify config for STR Booster Cohost — static site, no build step.
[build]
  publish = "."
  command = ""

# Serve index.html at the root (default), and return it for unknown paths
# so deep links don't 404 on this single-page site.
[[redirects]]
  from = "/community.html"
  to = "https://my.hostgrowthhub.com/communities/groups/host-growth-hub/home?invite=6aa7a9206e3c5d8ede86e13d"
  status = 302
  force = true

[[redirects]]
  from = "/community"
  to = "https://my.hostgrowthhub.com/communities/groups/host-growth-hub/home?invite=6aa7a9206e3c5d8ede86e13d"
  status = 302
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Review this redesign privately in Sites. Do not publish branch/PR previews.
[context.deploy-preview]
  ignore = "exit 0"
[context.branch-deploy]
  ignore = "exit 0"
