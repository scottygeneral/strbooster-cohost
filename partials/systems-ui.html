<figure class="dx-ui dx-ui--marketing" data-system="marketing" aria-hidden="true">
  <div class="dx-ui__panel">

      <span class="dx-ui__head-text">

      </span>
      <span class="dx-ui__chip">Illustration</span>
    </header>

    <div class="dx-ui__body">
      <div class="dx-ui__row dx-ui__row--between dx-ui__in" style="--i:1">
        <span class="dx-ui__stack">
          <span class="dx-ui__eyebrow">Campaign</span>
          <span class="dx-ui__h">Spring break · family campaign</span>
        </span>
        <span class="dx-ui__tag">Draft</span>
      </div>

      <div class="dx-ui__pills dx-ui__in" style="--i:2">
        <span class="dx-ui__pill is-on"><span class="dx-ui__ico dx-ui__ico--mail"></span>Email</span>
        <span class="dx-ui__pill is-on"><span class="dx-ui__ico dx-ui__ico--insta"></span>Instagram</span>

      <div class="dx-ui__draft dx-ui__in" style="--i:3">
        <div class="dx-ui__row dx-ui__row--between">
          <span class="dx-ui__eyebrow">Headline</span>
          <span class="dx-ui__meta">Families · Mar 7–29</span>
        </div>
        <p class="dx-ui__type"><span class="dx-ui__type-text">Oceanfront mornings, made for families.</span><span class="dx-ui__type-mask"></span></p>
        <p class="dx-ui__copy">Wake up to the water, walk to the beach, keep evenings easy.</p>
        <span class="dx-ui__skel"><span></span><span></span></span>
      </div>

      <div class="dx-ui__approve dx-ui__in" style="--i:4">
        <span class="dx-ui__approve-status"><span class="dx-ui__dot dx-ui__dot--wait"></span>Waiting for your approval</span>
        <span class="dx-ui__actions">
          <span class="dx-ui__btn dx-ui__btn--ghost">Edit</span>
          <span class="dx-ui__btn dx-ui__btn--primary">Approve</span>
        </span>
      </div>
    </div>
  </div>
</figure>

<figure class="dx-ui dx-ui--direct" data-system="direct" aria-hidden="true">
  <div class="dx-ui__panel">
    <header class="dx-ui__head dx-ui__head--browser dx-ui__in" style="--i:0">
      <span class="dx-ui__lights"><span></span><span></span><span></span></span>
      <span class="dx-ui__url"><span class="dx-ui__lock"></span>Your direct booking site</span>
      <span class="dx-ui__chip">Illustration</span>
    </header>

    <div class="dx-ui__body dx-ui__site">
      <div class="dx-ui__hero dx-ui__in" style="--i:1">
        <span class="dx-ui__scene"><span class="dx-ui__sun"></span><span class="dx-ui__sea"></span><span class="dx-ui__sand"></span><span class="dx-ui__palm"></span></span>
        <span class="dx-ui__hero-text">
          <span class="dx-ui__brand">Seabreeze Villa</span>
          <span class="dx-ui__sub">Marathon, FL · 4 bedrooms · Sleeps 8</span>
        </span>
      </div>

      <div class="dx-ui__widget dx-ui__in" style="--i:2">
        <div class="dx-ui__fields">
          <span class="dx-ui__field"><span class="dx-ui__eyebrow">Dates</span><span class="dx-ui__val">Mar 14 – Mar 21</span></span>
          <span class="dx-ui__field"><span class="dx-ui__eyebrow">Guests</span><span class="dx-ui__val">4 guests</span></span>
        </div>
        <dl class="dx-ui__lines">
          <div><dt>$468 × 7 nights</dt><dd>$3,276</dd></div>
          <div><dt>Cleaning fee</dt><dd>$225</dd></div>
          <div class="dx-ui__total"><dt>Total</dt><dd>$3,501</dd></div>

          <span>Booking confirmed · no OTA fee</span>

        <span class="dx-ui__btn dx-ui__btn--primary dx-ui__btn--block">Book direct</span>

    </div>
  </div>
</figure>

<figure class="dx-ui dx-ui--concierge" data-system="concierge" aria-hidden="true">

  </div>
</figure>
