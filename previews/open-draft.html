<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>STR Booster — Design draft 02</title><style>body{margin:0;background:#f5f3ee;color:#0d1f2d;font:16px/1.6 system-ui,sans-serif}main{max-width:600px;margin:12vh auto;padding:24px}a{color:#1a7f64}iframe{display:block;width:100%;height:100dvh;border:0}h1{font-size:40px;font-weight:500;letter-spacing:-.04em}</style></head><body><main id="status"><h1>STR Booster<br>Design draft 02.</h1><p id="message">Loading the GitHub review branch…</p><p>This is a design preview, not the published website. No analytics or chat widgets run here.</p><a href="https://github.com/scottygeneral/strbooster-cohost/pull/3">Open the GitHub draft ↗</a></main><noscript><p>Enable JavaScript to load the preview, or download the review artifact from the GitHub Actions run.</p></noscript><script>
(async()=>{
'use strict';
const base='https://raw.githubusercontent.com/scottygeneral/strbooster-cohost/design/cinematic-guest-intel-home/';
const load=async path=>{const response=await fetch(base+path,{cache:'no-store'});if(!response.ok)throw new Error('GitHub could not return '+path);return response.text();};
try{
 const [html,css,js]=await Promise.all([load('templates/home.html'),load('story.css'),load('story.js')]);
 const doc=new DOMParser().parseFromString(html,'text/html');
 doc.querySelectorAll('script:not([type="application/ld+json"]),noscript,link[rel="canonical"],[data-reviews]').forEach(el=>el.remove());
 const old=doc.querySelector('link[href="/story.css"]');if(old)old.remove();
 const style=doc.createElement('style');style.textContent=css;doc.head.append(style);
 const robots=doc.createElement('meta');robots.name='robots';robots.content='noindex,nofollow';doc.head.append(robots);
 doc.title='DESIGN DRAFT 02 — STR Booster';
 doc.querySelectorAll('[src],[href]').forEach(el=>{
  ['src','href'].forEach(attr=>{const value=el.getAttribute(attr);if(!value||!value.startsWith('/'))return;if(value.startsWith('/assets/')||value==='/favicon.svg')el.setAttribute(attr,base+value.slice(1));else if(attr==='href'&&value.startsWith('/#'))el.setAttribute(attr,value.slice(1));else el.setAttribute(attr,'https://strbooster.com'+value);});
 });
 const script=doc.createElement('script');script.textContent=js;doc.body.append(script);
 const frame=document.createElement('iframe');frame.title='STR Booster website design draft';frame.setAttribute('sandbox','allow-scripts allow-popups allow-top-navigation-by-user-activation');frame.srcdoc='<!doctype html>'+doc.documentElement.outerHTML;document.body.replaceChildren(frame);
}catch(error){document.getElementById('message').textContent='The preview could not load. Open the GitHub draft below, or download the latest design-review artifact. '+error.message;}
})();
</script></body></html>
